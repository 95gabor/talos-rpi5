# Pi 5 fan control CronJob — apply with scripts/deploy-rpi5-fan-cronjob.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rpi5-fan-control
  namespace: kube-system
  labels:
    app: rpi5-fan-control
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            app: rpi5-fan-control
        spec:
          restartPolicy: Never
          nodeName: __FAN_NODE__
          containers:
            - name: fan-ctl
              image: python:3.12-slim
              command: ["python3", "/scripts/fan.py", "auto"]
              env:
                - name: RP1_RESOURCE1
                  value: /host-sys/bus/pci/devices/0002:01:00.0/resource1
              securityContext:
                privileged: true
              volumeMounts:
                - name: sys
                  mountPath: /host-sys
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: sys
              hostPath:
                path: /sys
                type: Directory
            - name: scripts
              configMap:
                name: rpi5-fan-control-script
